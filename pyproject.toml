[project]
name = "design-doc-review-agent"
version = "0.1.0"
description = "AI-Powered Design Document Review System with RAG"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0.0",
    "unstructured>=0.10.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "markdown>=3.4.0",
    "rank-bm25>=0.2.2",
    "langchain-openai>=1.1.14",
    "colormath>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
